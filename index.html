<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atividade de Biologia — Grupos</title><link rel="icon" href="public/favicon.svg"><style>:root{font-family:system-ui;background:#f5f8f6;color:#12312b}body{margin:0}.top{padding:14px 20px;border-bottom:1px solid #dce8e3;display:flex;justify-content:space-between}.top a{color:#12312b;text-decoration:none;font-weight:800}.login{background:#0f766e;color:white!important;padding:8px 12px;border-radius:10px}.wrap{max-width:1100px;margin:auto;padding:65px 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid #dce8e3;border-radius:20px;padding:22px}.card a{display:inline-block;background:#0f766e;color:white;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:800}.muted{color:#61746f}.status{margin-top:18px;padding:12px;border-radius:10px;background:#e5f3ef}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><header class="top"><a href="./">✦ Biologia — Atividade Prática</a><span style="display:flex;gap:8px;align-items:center"><a id="teacher" class="login" href="professor/" hidden>Painel</a><a id="login" class="login" href="login/">Entrar</a></span></header><main class="wrap"><p class="muted">ATIVIDADE PRÁTICA</p><h1>Atividade Prática de Biologia</h1><p class="muted">Escolha um grupo para consultar ou editar sua receita.</p><div id="account"></div><section id="groups" class="grid"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="public/supabase.js"></script><script>(async()=>{const s=await sb.auth.getSession();if(s.data.session){login.textContent="Minha conta";login.href="login/";const p=await sb.from("profiles").select("role,group_id,is_anonymous").eq("id",s.data.session.user.id).maybeSingle();if(!p.error&&p.data){if(p.data.role==="teacher")teacher.hidden=false;if(p.data.is_anonymous&&!p.data.group_id)account.innerHTML='<p class="status">Conta anônima criada. Você poderá editar somente depois que o professor atribuir seu grupo.</p>';else if(p.data.is_anonymous)account.innerHTML='<p class="status">Conta anônima organizada em um grupo pelo professor.</p>'}}const r=await sb.from("groups").select("name,slug").order("slug");if(r.error){groups.innerHTML="<p>Erro ao carregar grupos.</p>";return}groups.innerHTML=r.data.map(g=>{const m=g.name.match(/^Grupo (\d+) — (.+)$/);return '<article class="card"><p class="muted">GRUPO '+m[1]+'</p><h2>'+m[2]+'</h2><p class="muted">Tema da atividade</p><a href="'+g.slug+'/">Abrir grupo</a></article>'}).join("")})();</script>
