<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu perfil — Biologia</title><link rel="icon" href="../public/favicon.svg"><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f8f6;color:#12312b}*{box-sizing:border-box}body{margin:0}.top{padding:14px 20px;border-bottom:1px solid #dce8e3;display:flex;justify-content:space-between}.top a{color:#12312b;text-decoration:none;font-weight:800}.wrap{max-width:760px;margin:auto;padding:45px 20px}.card{background:white;border:1px solid #dce8e3;border-radius:22px;padding:28px;margin-bottom:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin:14px 0}.field label{display:block;font-weight:750;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #dce8e3;border-radius:10px;font:inherit}.field input[readonly]{background:#f1f5f3}.btn{border:0;border-radius:10px;padding:11px 15px;background:#0f766e;color:white;font-weight:800;cursor:pointer}.muted{color:#61746f}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#e5f3ef;font-weight:800}.note{padding:13px;border-radius:10px;background:#fff3cd}.msg{margin-top:12px;color:#61746f}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><header class="top"><a href="../">Biologia — Atividade Prática</a><a href="../">Voltar</a></header><main class="wrap"><h1>Meu perfil</h1><p class="muted">Veja seus dados e mantenha seu nome atualizado.</p><div id="app">Carregando...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../public/supabase.js"></script><script>const app=document.querySelector("#app"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function load(){const s=await sb.auth.getSession();if(!s.data.session){location.href="../login/";return}const u=s.data.session.user;const p=await sb.from("profiles").select("full_name,role,group_id,call_number,is_anonymous").eq("id",u.id).single();if(p.error){app.innerHTML="<div class='card'>Não foi possível carregar seu perfil.</div>";return}let group=null;if(p.data.group_id){const g=await sb.from("groups").select("name").eq("id",p.data.group_id).single();group=g.data}app.innerHTML=`<section class="card"><h2>Dados da conta</h2><div class="field"><label>Nome</label><input id="name" value="${esc(p.data.full_name||"")}" placeholder="Seu nome completo"></div><div class="row"><div class="field"><label>Número da chamada</label><input value="${p.data.call_number??"Não definido"}" readonly></div><div class="field"><label>Função</label><p><span class="badge">${p.data.role==="teacher"?"Professor":"Aluno"}</span></p></div></div><div class="field"><label>Grupo</label><input value="${esc(group?.name||"Ainda não organizado")}" readonly></div>${p.data.is_anonymous&&!p.data.group_id?'<p class="note">Sua conta é anônima e ainda não foi organizada em um grupo. O professor precisa atribuir seu grupo e número da chamada.</p>':""}<button id="save" class="btn">Salvar nome</button><button id="logout" class="btn" style="margin-left:8px;background:#fff;color:#12312b;border:1px solid #dce8e3">Sair</button><p id="msg" class="msg"></p></section>`;save.onclick=async()=>{msg.textContent="Salvando...";const r=await sb.from("profiles").update({full_name:name.value.trim()||null}).eq("id",u.id);msg.textContent=r.error?r.error.message:"Nome atualizado."};logout.onclick=async()=>{await sb.auth.signOut();location.href="../"};}load();</script></body></html>
