<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu perfil — Biologia</title><link rel="icon" href="../public/favicon.svg"><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f8f6;color:#12312b}*{box-sizing:border-box}body{margin:0}.top{padding:14px 20px;border-bottom:1px solid #dce8e3;display:flex;justify-content:space-between}.top a{color:#12312b;text-decoration:none;font-weight:800}.wrap{max-width:760px;margin:auto;padding:45px 20px}.card{background:white;border:1px solid #dce8e3;border-radius:22px;padding:28px;margin-bottom:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin:14px 0}.field label{display:block;font-weight:750;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #dce8e3;border-radius:10px;font:inherit}.field input[readonly]{background:#f1f5f3}.btn{border:0;border-radius:10px;padding:11px 15px;background:#0f766e;color:white;font-weight:800;cursor:pointer}.muted{color:#61746f}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#e5f3ef;font-weight:800}.note{padding:13px;border-radius:10px;background:#fff3cd}.msg{margin-top:12px;color:#61746f}@media(max-width:650px){.row{grid-template-columns:1fr}}.logout-wrap{margin-top:36px;padding-top:24px;border-top:1px solid #e4ece9}.logout-btn{background:#dc2626!important;color:#fff!important;border:0!important;width:100%}.logout-btn:hover{background:#b91c1c!important}</style></head><body><header class="top"><a href="../">Biologia — Atividade Prática</a><a href="../">Voltar</a></header><main class="wrap"><h1>Meu perfil</h1><p class="muted">Veja seus dados e mantenha seu nome atualizado.</p><div id="app">Carregando...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../public/supabase.js"></script><script>const app=document.querySelector("#app"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function load(){const s=await sb.auth.getSession();if(!s.data.session){location.href="../login/";return}const u=s.data.session.user;const p=await sb.from("profiles").select("full_name,role,group_id,call_number,is_anonymous").eq("id",u.id).single();if(p.error){app.innerHTML="<div class='card'>Não foi possível carregar seu perfil.</div>";return}let group=null;if(p.data.group_id){const g=await sb.from("groups").select("name").eq("id",p.data.group_id).single();group=g.data}app.innerHTML=`<section class="card"><h2>Dados da conta</h2><div class="field"><label>Nome</label><input id="name" value="${esc(p.data.full_name||"")}" placeholder="Seu nome completo"></div><div class="row"><div class="field"><label>Número da chamada</label><input id="callNumber" type="number" min="1" max="999" value="${p.data.call_number??""}" placeholder="Seu número"></div><div class="field"><label>Função</label><p><span class="badge">${p.data.role==="teacher"?"Professor":"Aluno"}</span></p></div></div><div class="field"><label>Grupo</label><input value="${esc(group?.name||"Ainda não organizado")}" readonly></div>${p.data.is_anonymous&&!p.data.group_id?'<p class="note">Sua conta é anônima e ainda não foi organizada em um grupo. O professor precisa atribuir seu grupo e número da chamada.</p>':""}<button id="save" class="btn">Salvar nome e número</button><p id="msg" class="msg"></p><div class="logout-wrap"><button id="logout" class="btn logout-btn">Sair da conta</button></div></section>`;const save=document.getElementById("save"),callNumber=document.getElementById("callNumber"),logout=document.getElementById("logout"),nameInput=document.getElementById("name"),msg=document.getElementById("msg");save.onclick=async()=>{const newName=nameInput.value.trim(),newCall=Number(callNumber.value);if(!newName){msg.textContent="Digite um nome.";return}if(!Number.isInteger(newCall)||newCall<1||newCall>999){msg.textContent="Digite um número de chamada válido.";return}save.disabled=true;msg.textContent="Salvando...";const r=await sb.rpc("update_my_profile_name",{new_name:newName});save.disabled=false;if(r.error){msg.textContent="Não foi possível salvar o nome: "+r.error.message;return}const n=await sb.rpc("update_my_profile_call_number",{new_call_number:newCall});if(n.error){msg.textContent="Nome salvo, mas não foi possível salvar o número: "+n.error.message;return}msg.textContent="Nome e número atualizados com sucesso.";};logout.onclick=async()=>{await sb.auth.signOut();location.href="../"};}load();</script></body></html>
