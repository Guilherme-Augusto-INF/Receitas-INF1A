<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Biologia</title><link rel="icon" href="../public/favicon.svg"><style>:root{font-family:system-ui;background:#f5f8f6;color:#12312b}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:white;border:1px solid #dce8e3;border-radius:22px;padding:28px}label{display:block;font-weight:700;margin:15px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #dce8e3;border-radius:10px;font:inherit}button{margin-top:12px;background:#0f766e;color:white;font-weight:800;cursor:pointer}.secondary{background:white;color:#12312b}.anonymous{background:#e5f3ef;color:#12312b}.msg{margin-top:12px;color:#61746f}.sep{display:flex;align-items:center;gap:10px;margin:18px 0;color:#82928e}.sep:before,.sep:after{content:"";height:1px;background:#dce8e3;flex:1}</style><body><main class="card"><a href="../">← Voltar</a><h1>Entrar</h1><p>Use uma conta para editar a atividade. Você também pode entrar como <strong>anônimo</strong>; nesse modo, o professor precisa primeiro colocar você em um grupo.</p><form id="f"><label>E-mail</label><input id="email" type="email" required><label>Senha</label><input id="password" type="password" minlength="6" required><button>Entrar</button></form><button id="signup" class="secondary">Criar conta com e-mail</button><div class="sep">ou</div><button id="anonymous" class="anonymous">Entrar como anônimo</button><p id="msg" class="msg"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../public/supabase.js"></script><script>const m=document.querySelector("#msg");f.onsubmit=async e=>{e.preventDefault();m.textContent="Entrando...";const{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)m.textContent=error.message;else location.href="../"};signup.onclick=async()=>{m.textContent="Criando conta...";const{error}=await sb.auth.signUp({email:email.value,password:password.value,options:{emailRedirectTo:location.origin+location.pathname.replace("login/","")}});m.textContent=error?error.message:"Conta criada. Confirme o e-mail se solicitado."};anonymous.onclick=async()=>{m.textContent="Criando conta anônima...";const{error}=await sb.auth.signInAnonymously();if(error)m.textContent=error.message;else location.href="../"};</script>
