<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://fbniifpkiyafpuhpnbll.supabase.co wss://fbniifpkiyafpuhpnbll.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <link rel="icon" href="../public/favicon.svg">
  <link rel="stylesheet" href="../public/styles.css?v=3.0.0">
  <title>Entrar — Biologia INF1A</title>
</head>
<body>
  <main class="wrap narrow">
    <section class="panel reveal is-visible">
      <a class="back-link" href="../">← Voltar ao início</a>
      <p class="eyebrow">ACESSO À ATIVIDADE</p>
      <h1>Entrar</h1>
      <p class="muted">Use sua conta para editar o que pertence ao seu grupo. O acesso anônimo serve apenas para consulta.</p>
      <form id="loginForm" novalidate>
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required></div>
        <button id="login-submit" class="btn full-width" type="submit">Entrar</button>
      </form>
      <a class="btn secondary full-width separated" href="../cadastro/">Criar uma conta</a>
      <button id="anonymous" class="btn secondary full-width separated" type="button">Continuar apenas para consulta</button>
      <p id="msg" class="form-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
  <script src="../public/supabase.js?v=3.0.0"></script>

  <script src="../public/effects.js?v=3.0.0"></script>
  <script src="../public/login.js?v=3.0.0"></script>
