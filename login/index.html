<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Biologia</title><link rel="icon" href="../public/favicon.svg"><link rel="stylesheet" href="../public/styles.css?v=3"></head><body><main class="wrap" style="max-width:560px"><section class="panel reveal is-visible"><a href="../">← Voltar</a><p class="muted">ACESSO À ATIVIDADE</p><h1>Entrar</h1><p class="muted">Use uma conta para editar a atividade. Você também pode entrar como anônimo; o professor precisa organizar a conta antes de permitir edição.</p><form id="loginForm"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" minlength="6" required></div><button class="btn" type="submit">Entrar</button></form><button id="signup" class="btn secondary" style="margin-top:12px;width:100%">Criar conta com e-mail</button><button id="anonymous" class="btn secondary" style="margin-top:12px;width:100%">Entrar como anônimo</button><p id="msg" class="muted"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../public/supabase.js?v=3"></script><script src="../public/theme.js?v=3"></script><script src="../public/effects.js?v=3"></script><script>const msg=document.querySelector('#msg');document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();msg.textContent='Entrando...';const{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.textContent=error.message;else location.href='../'};document.querySelector('#signup').onclick=async()=>{msg.textContent='Criando conta...';const{error}=await sb.auth.signUp({email:email.value,password:password.value,options:{emailRedirectTo:location.origin+location.pathname.replace('login/','')}});msg.textContent=error?error.message:'Conta criada. Confirme o e-mail se solicitado.'};document.querySelector('#anonymous').onclick=async()=>{msg.textContent='Criando conta anônima...';const{error}=await sb.auth.signInAnonymously();if(error)msg.textContent=error.message;else location.href='../'};</script></body></html>
