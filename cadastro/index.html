<body><main class="wrap narrow"><section class="panel reveal is-visible">
<a class="back-link" href="../login/">← Voltar para entrar</a>
<p class="eyebrow">NOVA CONTA</p><h1>Criar conta</h1>
<p class="muted">Cadastre seu e-mail e uma senha para participar da atividade.</p>
<form id="signupForm" novalidate>
<div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required></div>
<div class="field"><label for="confirmPassword">Confirmar senha</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required></div>
<button id="signup-submit" class="btn full-width" type="submit">Criar conta</button>
</form>
<p class="muted separated">Já tem uma conta? <a href="../login/">Entrar</a></p>
<p id="msg" class="form-message" role="status" aria-live="polite"></p>
</section></main>
