<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grupo 2 — Vitaminas</title><link rel="icon" href="../public/favicon.svg"><style>body{margin:0;font-family:system-ui;background:#f5f8f6;color:#12312b}.top{padding:14px 20px;border-bottom:1px solid #dce8e3;display:flex;justify-content:space-between}.top a{color:#12312b;font-weight:800}.btn{padding:9px 13px;border:1px solid #dce8e3;border-radius:10px;background:#fff;text-decoration:none;color:#12312b;cursor:pointer}.wrap{max-width:850px;margin:auto;padding:45px 20px}.box,.recipe{background:#fff;border:1px solid #dce8e3;border-radius:18px;padding:22px;margin-top:18px}.muted{color:#61746f}.note{padding:15px;background:#e5f3ef;border-radius:12px}.edit{display:none}.edit.show{display:block}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dce8e3;border-radius:10px;font:inherit}.field textarea{min-height:120px}.save{padding:11px 16px;border:0;border-radius:10px;background:#0f766e;color:white;font-weight:800;cursor:pointer}.new{display:none;margin-bottom:10px}</style></head><body><header class="top"><a href="../">Biologia — Atividade Prática</a><a class="btn" href="../login/">Entrar</a></header><main class="wrap"><a href="../">← Voltar</a><p class="muted">GRUPO 2</p><div class="box"><h1>Vitaminas</h1><button id="new" class="save new">+ Adicionar nova receita ao grupo</button><div id="view"><p class="note">Carregando...</p></div><section id="edit" class="edit"><hr><h2>Editar receita</h2><div class="field"><label>Nome</label><input id="title"></div><div class="field"><label>Ingredientes</label><textarea id="ingredients"></textarea></div><div class="field"><label>Modo de preparo</label><textarea id="instructions"></textarea></div><div class="field"><label>Observações</label><textarea id="notes"></textarea></div><button id="save" class="save">Salvar</button><p id="status" class="muted"></p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0"></script><script src="../public/supabase.js?v=7"></script><script>const slug="grupo-2",view=document.getElementById("view"),edit=document.getElementById("edit"),save=document.getElementById("save"),status=document.getElementById("status");let groupId,recipes=[],selected=null,canEdit=false;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const error=e=>view.innerHTML='<p class="note"><b>Não foi possível carregar o grupo.</b><br>'+esc(e?.message||e)+'</p>';function render(){view.innerHTML=recipes.length?'<h2>Receitas do grupo</h2>'+recipes.map(r=>'<article class="recipe"><h3>'+esc(r.title)+'</h3><b>Ingredientes</b><p>'+esc(r.ingredients).replace(/\\n/g,"<br>")+'</p><b>Modo de preparo</b><p>'+esc(r.instructions).replace(/\\n/g,"<br>")+'</p>'+(r.notes?'<b>Observações</b><p>'+esc(r.notes).replace(/\\n/g,"<br>")+'</p>':'')+(canEdit?'<button class="btn" onclick="editRecipe(\\''+r.id+'\\')">Editar receita</button>':'')+'</article>').join(""):'<p class="note">Nenhuma receita cadastrada ainda.</p><p class="muted">O grupo pode usar mais de uma receita.</p>'}window.editRecipe=id=>{const r=recipes.find(x=>x.id===id);if(!r)return;selected=id;edit.classList.add("show");title.value=r.title||"";ingredients.value=r.ingredients||"";instructions.value=r.instructions||"";notes.value=r.notes||""};function novo(){selected=null;edit.classList.add("show");title.value=ingredients.value=instructions.value=notes.value=""}async function load(){try{if(!window.sb)throw Error("Banco de dados não inicializado.");const g=await sb.from("groups").select("id").eq("slug",slug).limit(1);if(g.error)throw g.error;if(!g.data?.length)throw Error("Grupo não encontrado.");groupId=g.data[0].id;const r=await sb.from("recipes").select("*").eq("group_id",groupId).order("updated_at",{ascending:false});if(r.error)throw r.error;recipes=r.data||[];const s=await sb.auth.getSession();if(s.data.session){const p=await sb.from("profiles").select("role,group_id,is_anonymous").eq("id",s.data.session.user.id).limit(1);if(!p.error&&p.data?.length){canEdit=p.data[0].role==="teacher"||p.data[0].group_id===groupId;if(p.data[0].is_anonymous&&!p.data[0].group_id){view.innerHTML='<p class="note">Conta anônima aguardando organização pelo professor.</p>';return}}}render();if(canEdit)new.style.display="inline-block"}catch(e){error(e)}}new.onclick=novo;save.onclick=async()=>{try{status.textContent="Salvando...";const payload={group_id:groupId,title:title.value.trim()||"Nova receita",ingredients:ingredients.value,instructions:instructions.value,notes:notes.value};const r=selected?await sb.from("recipes").update(payload).eq("id",selected).select().single():await sb.from("recipes").insert(payload).select().single();if(r.error)throw r.error;if(selected)recipes=recipes.map(x=>x.id===selected?r.data:x);else recipes=[r.data,...recipes];render();status.textContent="Receita salva."}catch(e){status.textContent="Erro: "+e.message}};load();</script></body></html>
