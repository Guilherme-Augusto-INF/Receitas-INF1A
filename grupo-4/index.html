<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grupo 4 — Carboidratos</title><link rel="icon" href="../public/favicon.svg"><style>:root{font-family:system-ui;background:#f5f8f6;color:#12312b}body{margin:0;line-height:1.55}.top{padding:14px 20px;border-bottom:1px solid #dce8e3;display:flex;justify-content:space-between}.top a{color:#12312b;font-weight:800}.btn{padding:8px 12px;border:1px solid #dce8e3;border-radius:10px;background:white;text-decoration:none;color:#12312b}.wrap{max-width:850px;margin:auto;padding:55px 20px}.box{background:white;border:1px solid #dce8e3;border-radius:22px;padding:28px;margin-top:22px}.muted{color:#61746f}.note{padding:15px;background:#e5f3ef;border-radius:12px}.edit{display:none}.edit.show{display:block}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dce8e3;border-radius:10px;font:inherit}.field textarea{min-height:120px}.save{padding:11px 16px;border:0;border-radius:10px;background:#0f766e;color:white;font-weight:800}</style><header class="top"><a href="../">Biologia — Atividade Prática</a><a class="btn" id="login" href="../login/">Entrar</a></header><main class="wrap"><a href="../">← Voltar</a><p class="muted">GRUPO 4</p><div class="box"><h1>Carboidratos</h1><div id="view"><p class="note">Carregando...</p></div><section id="edit" class="edit"><hr><h2>Editar receita</h2><div class="field"><label>Nome</label><input id="title"></div><div class="field"><label>Ingredientes</label><textarea id="ingredients"></textarea></div><div class="field"><label>Modo de preparo</label><textarea id="instructions"></textarea></div><div class="field"><label>Observações</label><textarea id="notes"></textarea></div><button id="save" class="save">Salvar</button><p id="status" class="muted"></p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../public/supabase.js"></script><script>const slug="grupo-4",view=document.querySelector("#view"),edit=document.querySelector("#edit"),login=document.querySelector("#login");let groupId,recipe;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function render(){if(!recipe){view.innerHTML='<p class="note">A receita ainda não foi cadastrada.</p><p class="muted">Quando seu grupo estiver organizado, um aluno ou professor poderá cadastrar a receita.</p>';return}view.innerHTML='<h2>'+esc(recipe.title)+'</h2><h3>Ingredientes</h3><p>'+esc(recipe.ingredients).replace(/\n/g,"<br>")+'</p><h3>Modo de preparo</h3><p>'+esc(recipe.instructions).replace(/\n/g,"<br>")+'</p>'+(recipe.notes?'<h3>Observações</h3><p>'+esc(recipe.notes).replace(/\n/g,"<br>")+'</p>':'')}async function load(){const g=await sb.from("groups").select("id").eq("slug",slug).single();if(g.error)return;groupId=g.data.id;const r=await sb.from("recipes").select("*").eq("group_id",groupId).order("updated_at",{ascending:false}).limit(1).maybeSingle();recipe=r.data;render();const s=await sb.auth.getSession();if(!s.data.session)return;login.textContent="Sair";login.href="#";login.onclick=async e=>{e.preventDefault();await sb.auth.signOut();location.reload()};const p=await sb.from("profiles").select("role,group_id,is_anonymous").eq("id",s.data.session.user.id).single();if(p.error)return;const can=p.data.role==="teacher"||p.data.group_id===groupId;if(p.data.is_anonymous&&!p.data.group_id){view.innerHTML='<p class="note"><strong>Conta anônima aguardando organização.</strong><br>Você pode consultar o site, mas não pode editar nenhuma receita até o professor atribuir você a um grupo.</p>';return}if(can){edit.classList.add("show");title.value=recipe?.title||"Receita do Grupo 4";ingredients.value=recipe?.ingredients||"";instructions.value=recipe?.instructions||"";notes.value=recipe?.notes||""}}save.onclick=async()=>{status.textContent="Salvando...";const payload={group_id:groupId,title:title.value.trim()||"Receita do Grupo 4",ingredients:ingredients.value,instructions:instructions.value,notes:notes.value};const r=recipe?await sb.from("recipes").update(payload).eq("id",recipe.id).select().single():await sb.from("recipes").insert(payload).select().single();if(r.error){status.textContent=r.error.message;return}recipe=r.data;render();status.textContent="Salvo."};load();</script>
