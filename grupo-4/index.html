<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grupo 4 — Carboidratos</title><style>body{font-family:system-ui;max-width:850px;margin:auto;padding:30px;background:#f5f8f6;color:#12312b}.box{background:white;padding:25px;border-radius:18px}.note{padding:15px;background:#e5f3ef;border-radius:12px}</style></head><body><p><a href="../">← Voltar</a></p><div class="box"><h1>Grupo 4 — Carboidratos</h1><div id="view"><p class="note">Carregando...</p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0"></script><script src="../public/supabase.js?v=8"></script><script>async function start(){const v=document.getElementById('view');try{if(!window.sb)throw Error('Banco de dados não inicializado');const g=await sb.from('groups').select('id,name').eq('slug','grupo-4').limit(1);if(g.error)throw g.error;if(!g.data.length)throw Error('Grupo não encontrado');const r=await sb.from('recipes').select('title,ingredients,instructions,notes').eq('group_id',g.data[0].id).order('updated_at',{ascending:false});if(r.error)throw r.error;v.innerHTML=r.data.length?r.data.map(x=>'<article><h2>'+String(x.title||'').replace(/</g,'&lt;')+'</h2><p>'+String(x.ingredients||'').replace(/\n/g,'<br>')+'</p><p>'+String(x.instructions||'').replace(/\n/g,'<br>')+'</p></article>').join(''):'<p class="note">Nenhuma receita cadastrada ainda.</p>'}catch(e){v.innerHTML='<p class="note"><b>Erro ao carregar:</b> '+String(e.message||e)+'</p>'}}start();</script></body></html>
