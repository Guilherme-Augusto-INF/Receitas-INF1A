<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grupo 3 — Sais Minerais</title><link rel="icon" href="../public/favicon.svg"><style>:root{font-family:system-ui;background:#f5f8f6;color:#12312b}body{margin:0;line-height:1.55}.top{padding:14px 20px;border-bottom:1px solid #dce8e3;display:flex;justify-content:space-between}.top a{color:#12312b;font-weight:800}.btn{padding:8px 12px;border:1px solid #dce8e3;border-radius:10px;background:white;text-decoration:none;color:#12312b}.wrap{max-width:850px;margin:auto;padding:55px 20px}.box{background:white;border:1px solid #dce8e3;border-radius:22px;padding:28px;margin-top:22px}.muted{color:#61746f}.note{padding:15px;background:#e5f3ef;border-radius:12px}.edit{display:none}.edit.show{display:block}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dce8e3;border-radius:10px;font:inherit}.field textarea{min-height:120px}.save{padding:11px 16px;border:0;border-radius:10px;background:#0f766e;color:white;font-weight:800}.btn{display:inline-block;margin:6px 6px 6px 0;cursor:pointer}.recipe-card{padding:18px;border:1px solid #dce8e3;border-radius:14px;margin:12px 0}.new-recipe{display:none;margin-bottom:18px}</style><header class="top"><a href="../">Biologia — Atividade Prática</a><a class="btn" id="login" href="../login/">Entrar</a></header><main class="wrap"><a href="../">← Voltar</a><p class="muted">GRUPO 3</p><div class="box"><h1>Sais Minerais</h1><button id="newRecipe" class="save new-recipe">+ Adicionar nova receita ao grupo</button><div id="view"><p class="note">Carregando...</p></div><section id="edit" class="edit"><hr><h2>Editar receita</h2><div class="field"><label>Nome</label><input id="title"></div><div class="field"><label>Ingredientes</label><textarea id="ingredients"></textarea></div><div class="field"><label>Modo de preparo</label><textarea id="instructions"></textarea></div><div class="field"><label>Observações</label><textarea id="notes"></textarea></div><button id="save" class="save">Salvar</button><p id="status" class="muted"></p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../public/supabase.js"></script><script>const slug="grupo-3",view=document.querySelector("#view"),edit=document.querySelector("#edit"),login=document.querySelector("#login"),save=document.querySelector("#save"),status=document.querySelector("#status"),titleInput=document.querySelector("#title"),ingredientsInput=document.querySelector("#ingredients"),instructionsInput=document.querySelector("#instructions"),notesInput=document.querySelector("#notes");let groupId,recipes=[],selectedRecipe=null,canEdit=false;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function render(){if(!recipes.length){view.innerHTML='<p class="note">Nenhuma receita cadastrada ainda.</p><p class="muted">Seu grupo pode adicionar quantas receitas forem necessárias para o trabalho.</p>';return}view.innerHTML='<h2>Receitas do grupo</h2>'+recipes.map(r=>'<article class="recipe-card"><h3>'+esc(r.title)+'</h3><p class="muted">'+esc((r.ingredients||"").split("\n")[0]).slice(0,140)+'</p><button class="btn" onclick="selectRecipe(\''+r.id+'\')">Ver e editar</button></article>').join("") ;if(selectedRecipe){const r=recipes.find(x=>x.id===selectedRecipe);if(r)showRecipe(r)}}function showRecipe(r){view.querySelectorAll(".recipe-card").forEach(()=>{});edit.classList.add("show");titleInput.value=r.title||"";ingredientsInput.value=r.ingredients||"";instructionsInput.value=r.instructions||"";notesInput.value=r.notes||"";status.textContent=""}window.selectRecipe=id=>{selectedRecipe=id;const r=recipes.find(x=>x.id===id);if(r)showRecipe(r)};function newRecipe(){selectedRecipe=null;edit.classList.add("show");titleInput.value="";ingredientsInput.value="";instructionsInput.value="";notesInput.value="";status.textContent="Preencha os dados da nova receita."}async function load(){const g=await sb.from("groups").select("id").eq("slug",slug).single();if(g.error)return;groupId=g.data.id;const r=await sb.from("recipes").select("*").eq("group_id",groupId).order("updated_at",{ascending:false});recipes=r.data||[];render();const s=await sb.auth.getSession();if(!s.data.session)return;login.textContent="Sair";login.href="#";login.onclick=async e=>{e.preventDefault();await sb.auth.signOut();location.reload()};const p=await sb.from("profiles").select("role,group_id,is_anonymous").eq("id",s.data.session.user.id).single();if(p.error)return;canEdit=p.data.role==="teacher"||p.data.group_id===groupId;if(p.data.is_anonymous&&!p.data.group_id){view.innerHTML='<p class="note"><strong>Conta anônima aguardando organização.</strong><br>Você pode consultar o site, mas não pode editar nenhuma receita até o professor atribuir você a um grupo.</p>';return}if(canEdit){document.querySelector("#newRecipe").style.display="inline-block";if(recipes.length)showRecipe(recipes[0]);}}document.querySelector("#newRecipe").onclick=newRecipe;save.onclick=async()=>{status.textContent="Salvando...";save.disabled=true;const payload={group_id:groupId,title:titleInput.value.trim()||"Nova receita",ingredients:ingredientsInput.value,instructions:instructionsInput.value,notes:notesInput.value};const r=selectedRecipe?await sb.from("recipes").update(payload).eq("id",selectedRecipe).select().single():await sb.from("recipes").insert(payload).select().single();save.disabled=false;if(r.error){status.textContent=r.error.message;return}if(selectedRecipe){recipes=recipes.map(x=>x.id===selectedRecipe?r.data:x)}else{recipes=[r.data,...recipes];selectedRecipe=r.data.id}render();status.textContent="Receita salva.";};load();</script>
