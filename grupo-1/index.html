<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grupo 1 — Água</title><link rel="icon" href="../public/favicon.svg"><style>:root{font-family:system-ui;background:#f5f8f6;color:#12312b}body{margin:0;line-height:1.55}.top{padding:14px 20px;border-bottom:1px solid #dce8e3;display:flex;justify-content:space-between}.top a{color:#12312b;font-weight:800}.btn{padding:8px 12px;border:1px solid #dce8e3;border-radius:10px;background:white;text-decoration:none;color:#12312b}.wrap{max-width:850px;margin:auto;padding:55px 20px}.box{background:white;border:1px solid #dce8e3;border-radius:22px;padding:28px;margin-top:22px}.muted{color:#61746f}.note{padding:15px;background:#e5f3ef;border-radius:12px}.edit{display:none}.edit.show{display:block}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dce8e3;border-radius:10px;font:inherit}.field textarea{min-height:120px}.save{padding:11px 16px;border:0;border-radius:10px;background:#0f766e;color:white;font-weight:800}.btn{display:inline-block;margin:6px 6px 6px 0;cursor:pointer}.recipe-card{padding:18px;border:1px solid #dce8e3;border-radius:14px;margin:12px 0}.new-recipe{display:none;margin-bottom:18px}</style></head><body><header class="top"><a href="../">Biologia — Atividade Prática</a><a class="btn" id="login" href="../login/">Entrar</a></header><main class="wrap"><a href="../">← Voltar</a><p class="muted">GRUPO 1</p><div class="box"><h1>Água</h1><button id="newRecipe" class="save new-recipe">+ Adicionar nova receita ao grupo</button><div id="view"><p class="note">Carregando...</p></div><section id="edit" class="edit"><hr><h2>Editar receita</h2><div class="field"><label>Nome</label><input id="title"></div><div class="field"><label>Ingredientes</label><textarea id="ingredients"></textarea></div><div class="field"><label>Modo de preparo</label><textarea id="instructions"></textarea></div><div class="field"><label>Observações</label><textarea id="notes"></textarea></div><button id="save" class="save">Salvar</button><p id="status" class="muted"></p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0"></script><script src="../public/supabase.js?v=6"></script><script>const slug="grupo-1";const view=document.getElementById("view"),edit=document.getElementById("edit"),save=document.getElementById("save"),status=document.getElementById("status");let groupId=null,recipes=[],selectedRecipe=null,canEdit=false;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function fail(e){view.innerHTML='<p class="note"><strong>Não foi possível carregar este grupo.</strong><br>'+esc(e?.message||String(e||"Erro desconhecido"))+'</p>'}function render(){if(!recipes.length){view.innerHTML='<p class="note">Nenhuma receita cadastrada ainda.</p><p class="muted">Seu grupo pode adicionar quantas receitas forem necessárias para o trabalho.</p>';return}view.innerHTML='<h2>Receitas do grupo</h2>'+recipes.map(r=>'<article class="recipe-card"><h3>'+esc(r.title)+'</h3><h4>Ingredientes</h4><p>'+esc(r.ingredients).replace(/\\n/g,"<br>")+'</p><h4>Modo de preparo</h4><p>'+esc(r.instructions).replace(/\\n/g,"<br>")+'</p>'+(r.notes?'<h4>Observações</h4><p>'+esc(r.notes).replace(/\\n/g,"<br>")+'</p>':'')+(canEdit?'<button class="btn" onclick="selectRecipe(\\''+r.id+'\\')">Editar receita</button>':'')+'</article>').join("")}window.selectRecipe=id=>{selectedRecipe=id;const r=recipes.find(x=>x.id===id);if(!r)return;edit.classList.add("show");document.getElementById("title").value=r.title||"";document.getElementById("ingredients").value=r.ingredients||"";document.getElementById("instructions").value=r.instructions||"";document.getElementById("notes").value=r.notes||"";status.textContent="Editando esta receita."};function newRecipe(){selectedRecipe=null;edit.classList.add("show");document.getElementById("title").value="";document.getElementById("ingredients").value="";document.getElementById("instructions").value="";document.getElementById("notes").value="";status.textContent="Preencha os dados da nova receita."}async function load(){try{if(!window.sb)throw new Error("Conexão com o banco não foi inicializada.");const g=await sb.from("groups").select("id").eq("slug",slug).limit(1);if(g.error)throw g.error;if(!g.data?.length)throw new Error("Grupo não encontrado.");groupId=g.data[0].id;const r=await sb.from("recipes").select("*").eq("group_id",groupId).order("updated_at",{ascending:false});if(r.error)throw r.error;recipes=r.data||[];const s=await sb.auth.getSession();if(s.error)throw s.error;if(s.data.session){const p=await sb.from("profiles").select("role,group_id,is_anonymous").eq("id",s.data.session.user.id).limit(1);if(!p.error&&p.data?.length){canEdit=p.data[0].role==="teacher"||p.data[0].group_id===groupId;if(p.data[0].is_anonymous&&!p.data[0].group_id){view.innerHTML='<p class="note"><strong>Conta anônima aguardando organização.</strong><br>Você pode consultar o site, mas não pode editar nenhuma receita até o professor atribuir você a um grupo.</p>';return}}}render();if(canEdit){document.getElementById("newRecipe").style.display="inline-block"}}catch(e){fail(e)}}document.getElementById("newRecipe").onclick=newRecipe;save.onclick=async()=>{try{status.textContent="Salvando...";save.disabled=true;const payload={group_id:groupId,title:document.getElementById("title").value.trim()||"Nova receita",ingredients:document.getElementById("ingredients").value,instructions:document.getElementById("instructions").value,notes:document.getElementById("notes").value};const r=selectedRecipe?await sb.from("recipes").update(payload).eq("id",selectedRecipe).select().single():await sb.from("recipes").insert(payload).select().single();if(r.error)throw r.error;if(selectedRecipe)recipes=recipes.map(x=>x.id===selectedRecipe?r.data:x);else{recipes=[r.data,...recipes];selectedRecipe=r.data.id}render();status.textContent="Receita salva."}catch(e){status.textContent="Erro: "+(e.message||e)}finally{save.disabled=false}};load();</script></body></html>
