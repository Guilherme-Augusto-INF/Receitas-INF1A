<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Professor — Biologia</title><link rel="icon" href="../public/favicon.svg"><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f8f6;color:#12312b}*{box-sizing:border-box}body{margin:0}.top{padding:14px max(16px,calc((100vw - 1050px)/2));border-bottom:1px solid #dce8e3;display:flex;justify-content:space-between;align-items:center}.top a{color:#12312b;text-decoration:none;font-weight:800}.wrap{max-width:1050px;margin:auto;padding:42px 20px}.panel{background:white;border:1px solid #dce8e3;border-radius:22px;padding:25px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin:12px 0}.field label{display:block;font-weight:750;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #dce8e3;border-radius:10px;background:white;color:#12312b;font:inherit}.btn{border:0;border-radius:10px;padding:11px 15px;background:#0f766e;color:white;font-weight:800;cursor:pointer}.muted{color:#61746f}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 8px;border-bottom:1px solid #e4ece9;text-align:left}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:15px;background:#f1f5f3;border-radius:10px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#e5f3ef;font-size:12px}.pending{background:#fff3cd}@media(max-width:760px){.grid{grid-template-columns:1fr}.table{font-size:13px}.table th:nth-child(3),.table td:nth-child(3){display:none}}</style></head><body><header class="top"><a href="../">Biologia — Atividade Prática</a><a href="../" id="back">Voltar ao site</a></header><main class="wrap"><h1>Painel do Professor</h1><p class="muted">Gerencie alunos, grupos e permissões de edição.</p><div id="app">Carregando...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../public/supabase.js"></script><script>const app=document.querySelector("#app");let groups=[],profiles=[],currentUser;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function render(){app.innerHTML=`<div class="grid"><section class="panel"><h2>Novo grupo</h2><form id="groupForm"><div class="field"><label>Nome</label><input id="gname" placeholder="Ex.: Grupo 7 — Lipídeos" required></div><div class="field"><label>Slug</label><input id="gslug" placeholder="grupo-7" required pattern="[a-z0-9-]+"></div><div class="field"><label>Descrição</label><input id="gdesc"></div><button class="btn">Criar grupo</button></form><p id="gmsg" class="muted"></p></section><section class="panel"><h2>Organizar aluno</h2><form id="assignForm"><div class="field"><label>Aluno</label><select id="uid" required></select></div><div class="field"><label>Grupo</label><select id="gid"><option value="">Sem grupo</option></select></div><button class="btn">Salvar grupo do aluno</button></form><p id="amsg" class="muted"></p></section></div><section class="panel"><h2>Alunos e professores</h2><div id="people"></div></section><section class="panel"><h2>Grupos</h2><div id="groupList"></div></section>`;const uid=document.querySelector("#uid"),gid=document.querySelector("#gid");uid.innerHTML=profiles.map(p=>`<option value="${p.id}">${esc(p.full_name||"Usuário sem nome")} — ${esc(p.role)}</option>`).join("");gid.insertAdjacentHTML("beforeend",groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join(""));document.querySelector("#groupForm").onsubmit=async e=>{e.preventDefault();const r=await sb.from("groups").insert({name:gname.value.trim(),slug:gslug.value.trim(),description:gdesc.value.trim()});gmsg.textContent=r.error?r.error.message:"Grupo criado.";if(!r.error)await load()};document.querySelector("#assignForm").onsubmit=async e=>{e.preventDefault();const r=await sb.from("profiles").update({group_id:gid.value||null}).eq("id",uid.value);amsg.textContent=r.error?r.error.message:"Aluno organizado.";if(!r.error)await load()};people.innerHTML=profiles.length?`<table class="table"><thead><tr><th>Nome</th><th>Função</th><th>Grupo</th><th>Ação</th></tr></thead><tbody>${profiles.map(p=>{const g=groups.find(x=>x.id===p.group_id);return `<tr><td>${esc(p.full_name||"Sem nome")} </td><td>${esc(p.role)}</td><td>${esc(g?.name||"Sem grupo")}</td><td><div class="actions"><button class="btn" onclick="setRole('${p.id}','${p.role==="teacher"?"student":"teacher"}')">${p.role==="teacher"?"Tornar aluno":"Tornar professor"}</button></div></td></tr>`}).join("")}</tbody></table>`:"<div class='empty'>Nenhum perfil encontrado.</div>";groupList.innerHTML=groups.length?`<table class="table"><thead><tr><th>Grupo</th><th>Slug</th><th>Descrição</th><th>Ação</th></tr></thead><tbody>${groups.map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.slug)}</td><td>${esc(g.description||"")}</td><td><a class="btn" href="../${g.slug}/">Abrir</a></td></tr>`).join("")}</tbody></table>`:"<div class='empty'>Nenhum grupo.</div>"};window.setRole=async(id,role)=>{if(id===currentUser){alert("Não altere sua própria função por este painel.");return}const r=await sb.from("profiles").update({role}).eq("id",id);if(r.error)alert(r.error.message);else load()};async function load(){const s=await sb.auth.getSession();if(!s.data.session){location.href="../login/";return}currentUser=s.data.session.user.id;const me=await sb.from("profiles").select("role").eq("id",currentUser).single();if(me.error||me.data.role!=="teacher"){app.innerHTML="<section class='panel'><h2>Acesso negado</h2><p>Esta área é exclusiva para professores.</p><a class='btn' href='../'>Voltar</a></section>";return}const[g,p]=await Promise.all([sb.from("groups").select("*").order("slug"),sb.from("profiles").select("id,full_name,role,group_id,is_anonymous").eq("is_anonymous",false).order("full_name")]);if(g.error||p.error){app.innerHTML="<section class='panel'><p>Não foi possível carregar os dados.</p></section>";return}groups=g.data;profiles=p.data;render()}load();</script></body></html>
